<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Cut the Rope: DX</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" href="./icon-512.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <meta name="theme-color" content="#1b1b1f" />
        <meta name="mobile-web-app-capable" content="yes" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: #000;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                overscroll-behavior: none;
            }
            #game {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
            }
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: #1b1b1f;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                z-index: 10;
            }
            #splash.hidden {
                display: none;
            }
            #start {
                padding: 12px 28px;
                font-size: 1rem;
                border: 0;
                border-radius: 8px;
                cursor: pointer;
            }
            #start[hidden] {
                display: none;
            }
            #update {
                padding: 20px 24px;
                border: 0;
                border-radius: 10px;
                background: #1b1b1f;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                box-shadow: 0 8px 32px rgb(0 0 0 / 50%);
            }
            #update::backdrop {
                background: rgb(0 0 0 / 50%);
            }
            #update p {
                margin: 0 0 16px;
            }
            #update-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            #update button {
                padding: 8px 18px;
                font-size: 0.95rem;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <div id="splash">
            <p id="splash-progress">Loading…</p>
            <button id="start" hidden>Play</button>
        </div>
        <dialog id="update">
            <p>A new version of the game is ready.</p>
            <div id="update-actions">
                <button id="update-later">Later</button>
                <button id="update-now">Update</button>
            </div>
        </dialog>
        <script type="module" src="./pwa.js"></script>
        <script type="module">
            const start = document.getElementById("start");
            const splash = document.getElementById("splash");
            globalThis.ctrdxReady = () => {
                start.hidden = false;
                document.getElementById("splash-progress").textContent = "";
            };
            start.addEventListener("click", async () => {
                await globalThis.ctrdxStart();
                splash.classList.add("hidden");
            });
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
