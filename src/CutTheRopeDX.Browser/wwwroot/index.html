<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Cut the Rope: DX</title>
        <link rel="icon" href="./favicon.ico" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: #000;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                overscroll-behavior: none;
            }
            #game {
                display: block;
                width: 100%;
                height: 100%;
            }
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: #1b1b1f;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                z-index: 10;
            }
            #splash.hidden {
                display: none;
            }
            #start {
                padding: 12px 28px;
                font-size: 1rem;
                border: 0;
                border-radius: 8px;
                cursor: pointer;
            }
            #start[hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <div id="splash">
            <p id="splash-progress">Loading…</p>
            <button id="start" hidden>Play</button>
        </div>
        <script type="module" src="./main.js"></script>
    </body>
</html>
